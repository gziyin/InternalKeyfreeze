name: Build

on:
  push:
    branches: ['**']
    tags: ['v2.0*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
        cache: true

    - name: Build
      shell: cmd
      env:
        CI: '1'
      run: tools\build.bat

    - name: Copy runtime dependency
      shell: cmd
      run: copy sdk\library\x64\interception.dll bin\interception.dll

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: InternalKeyfreeze-${{ github.sha }}
        path: |
          bin/InternalKeyfreeze.exe
          bin/interception.dll
          driver/
          安装.bat
          卸载.bat
          LICENSE
          README.md
          README.en.md
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v2.0')

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: InternalKeyfreeze-${{ github.sha }}
        path: release/

    - name: Package zip
      run: |
        cd release
        zip -r ../InternalKeyfreeze-${{ github.ref_name }}.zip .
        cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: InternalKeyfreeze-${{ github.ref_name }}.zip
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        generate_release_notes: true
